  function callGasApi(params, callbackSuccess, callbackFailure) {
    const callbackName = 'gasCallback_' + Math.floor(Math.random() * 1000000);
    params.callback = callbackName;

    const queryString = Object.keys(params)
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
      .join('&');
    const script = document.createElement('script');
    script.src = API_ENDPOINT + '?' + queryString;

    window[callbackName] = function(data) {
      delete window[callbackName];
      document.body.removeChild(script);
      callbackSuccess(data);
    };

    script.onerror = function() {
      delete window[callbackName];
      document.body.removeChild(script);
      if (callbackFailure) callbackFailure(new Error('通信に失敗しました'));
    };

    document.body.appendChild(script);
  }

  function setLock(lockState) {
    isLoading = lockState;
    const modalAction = document.getElementById('modalActionArea');
    if (lockState) {
      if (modalAction) modalAction.classList.add('loading-locked');
    } else {
      if (modalAction) modalAction.classList.remove('loading-locked');
    }
  }

          }

        } else {
          if (isSmoothMode) {
            showAutoToast("⚠️ 番号: " + targetCode + "<br>該当データがありません", 1500, true);
          } else {
            showAutoToast("❌ 番号: " + targetCode + "<br>該当データがありません", 1500, true);
          }
        }
      },
      function(err) {
        if (!isSmoothMode) setLock(false);
        showAutoToast("⚠️ 通信エラーが発生しました", 1500, true);
      }
    );
  }

  function confirmCheckInAuto(data) {
    callGasApi(
      { action: 'checkin', code: data.code, count: data.count },
      function(res) {
        if (res && res.success) {
          showAutoToast("✅ " + data.nickname + " 様<br>（" + data.count + "名）受付完了！", 1200);
        } else {
          showAutoToast("❌ 受付失敗: " + ((res && res.message) || ""), 1500, true);
        }
      },
      function(err) {
        showAutoToast("❌ 通信エラー", 1500, true);
      }
    );
  }

  function openResultModal(res) {
    const modal = document.getElementById('resultModal');
    const badge = document.getElementById('modalBadge');
    const actionArea = document.getElementById('modalActionArea');
    const shortArea = document.getElementById('modalShortArea');
    const grid = document.getElementById('modalShortcutGrid');

    document.getElementById('modalName').innerText = res.nickname + " 様";
    document.getElementById('modalDetail').innerText = res.category + " / 申込: " + res.count + "名";

    if (res.status === "キャンセル") {
      badge.innerText = "【キャンセル済み】";
      badge.style.color = "var(--danger-color)";
      actionArea.style.display = 'none';
    } else if (res.status === "受付済") {
      badge.innerText = "【受付完了済み（入場: " + res.actualCount + "名）】";
      badge.style.color = "var(--warning-color)";
      actionArea.style.display = 'none';
    } else {
      badge.innerText = "【未受付】";
      badge.style.color = "var(--success-color)";
      actionArea.style.display = 'block';
      document.getElementById('modalBtnText').innerText = res.count + "名";

      const maxCount = parseInt(res.count, 10);
      grid.innerHTML = "";
      if (maxCount > 1) {
        shortArea.style.display = 'block';
        for (let i = 1; i < maxCount; i++) {
          const btn = document.createElement('button');
          btn.className = 'btn-short';
          btn.innerText = i + '名';
          btn.onclick = function() { confirmCheckIn(i); };
          grid.appendChild(btn);
        }
      } else {
        shortArea.style.display = 'none';
      }
    }

    modal.style.display = 'flex';
  }

  function closeResultModal() {
    document.getElementById('resultModal').style.display = 'none';
    inputCode = "";
    lastScannedCode = "";
  }

  function confirmCheckIn(count) {
    if (isLoading || !currentData) return;
    setLock(true);

    callGasApi(
      { action: 'checkin', code: currentData.code, count: count },
      function(res) {
        setLock(false);
        if (res && res.success) {
          closeResultModal();
          showAutoToast("✅ " + currentData.nickname + " 様<br>（" + count + "名）受付完了！", 1500);
        } else {
          alert("エラー: " + ((res && res.message) || "受付処理に失敗しました"));
        }
      },
      function(err) {
        setLock(false);
        alert("通信エラーが発生しました: " + err.message);
      }
    );
  }

  function showAutoToast(msg, duration, isWarning) {
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }
    const oldToast = document.getElementById('autoToast');
    if (oldToast) oldToast.remove();

    const toast = document.createElement('div');
    toast.id = 'autoToast';
    toast.className = 'toast-popup' + (isWarning ? ' toast-warning' : '');
    toast.innerHTML = msg;
    document.body.appendChild(toast);

    toastTimer = setTimeout(function() {
      if (toast && toast.parentNode) {
        toast.style.opacity = "0";
        setTimeout(function() {
          if (toast && toast.parentNode) {
            toast.remove();
          }
        }, 300);
      }
    }, duration);
  }

  function updateCameraSwitchBtnText() {
    const btn = document.getElementById('btnSwitchCamera');
    if (currentFacingMode === "user") {
      btn.innerText = "🔄 アウトカメラ";
    } else {
      btn.innerText = "🔄 インカメラ";
    }
  }

  function toggleCameraFacing() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    updateCameraSwitchBtnText();
    restartCamera();
  }

  function initCameraScanner() {
    if (isCameraRunning) return;
    
    document.getElementById('cameraStatus').innerText = "📷 起動中...";
    document.getElementById('cameraStatus').style.background = "#e8e0d0";

    const scannerCard = document.querySelector('.scanner-card');
    const boxSize = scannerCard ? Math.floor(Math.min(scannerCard.clientWidth, scannerCard.clientHeight) * 0.7) : 220;

    html5QrCode = new Html5Qrcode("reader");
    const config = {
      fps: 30,
      qrbox: { width: boxSize, height: boxSize },
      aspectRatio: 1.0,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    html5QrCode.start(
      { facingMode: currentFacingMode },
      config,
      function onScanSuccess(decodedText) {
        if (!isSmoothMode) {
          const modal = document.getElementById('resultModal');
          if (modal && modal.style.display === 'flex') return;
        }

        const code = extractCode(decodedText);
        if (code && code !== lastScannedCode) {
          lastScannedCode = code;
          playBeepSound();
          inputCode = code;
          searchCode();

          clearTimeout(scanCooldownTimer);
          scanCooldownTimer = setTimeout(function() {
            lastScannedCode = "";
          }, 2000);
        }
      },
      function onScanFailure() {}
    ).then(function() {
      isCameraRunning = true;

      const videoElem = document.querySelector('#reader video');
      if (videoElem) {
        if (currentFacingMode === "user") {
          videoElem.style.setProperty('transform', 'scaleX(-1)', 'important');
        } else {
          videoElem.style.setProperty('transform', 'none', 'important');
        }
      }

      document.getElementById('cameraStatus').innerText = "🟢 稼働中";
      document.getElementById('cameraStatus').style.background = "#e6f4ea";
      document.getElementById('cameraStatus').style.color = "#137333";
    }).catch(function(err) {
      isCameraRunning = false;
      document.getElementById('cameraStatus').innerText = "⚠️ OFF (再試行)";
      document.getElementById('cameraStatus').style.background = "#fce8e6";
      document.getElementById('cameraStatus').style.color = "#c5221f";
    });
  }

  function restartCamera() {
    const statusBadge = document.getElementById('cameraStatus');
    statusBadge.innerText = "🔄 再起動中...";
    
    if (html5QrCode) {
      html5QrCode.stop().then(function() {
        isCameraRunning = false;
        html5QrCode.clear();
        setTimeout(initCameraScanner, 300);
      }).catch(function() {
        isCameraRunning = false;
        setTimeout(initCameraScanner, 300);
      });
    } else {
      initCameraScanner();
    }
  }

  function extractCode(text) {
    if (!text) return null;
    const trimmed = String(text).trim();
    if (/^\d{5}$/.test(trimmed)) {
      return trimmed;
    }
    const match = trimmed.match(/(\d{5})/);
    if (match) {
      return match[1];
    }
    return null;
  }

  window.addEventListener('DOMContentLoaded', function() {
    updateCameraSwitchBtnText();
    initCameraScanner();
  });
</script>

</body>
</html>
