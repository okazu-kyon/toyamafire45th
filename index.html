<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>受付用 QR照合システム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary-color: #8b7355;
      --accent-color: #c5a059;
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #666666;
      --danger-color: #8b0000;
      --success-color: #2e7d32;
      --warning-color: #d97706;
      --border-color: #e5dec9;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー周りのスマート化 */
    .app-header {
      width: 100%;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      z-index: 10;
    }

    .admin-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--primary-color);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: nowrap;
    }

    .smooth-mode-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: bold;
      color: var(--primary-color);
      cursor: pointer;
      background: #f0eae1;
      padding: 4px 8px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .status-badge {
      font-size: 11px;
      background: #e8e0d0;
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-switch-camera {
      font-size: 11px;
      background: #ffffff;
      color: var(--primary-color);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    /* スキャン画面を全体に拡張 */
    .scanner-card {
      width: 100%;
      flex: 1;
      background: #000000;
      overflow: hidden;
      position: relative;
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      position: absolute;
      top: 0;
      left: 0;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .scanner-overlay-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 2px dashed rgba(255,255,255,0.9);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    }

    .scanner-hint {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    /* モーダル表示 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-sheet {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 18px 18px 0 0;
      padding: 16px 20px 24px 20px;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.25);
      border-top: 2px solid var(--accent-color);
    }
    .modal-badge { font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 4px; }
    .modal-name { font-size: 23px; font-weight: bold; color: var(--primary-color); text-align: center; margin: 2px 0 6px 0; }
    .modal-detail { font-size: 15px; color: var(--text-main); font-weight: bold; text-align: center; margin-bottom: 12px; }
    .btn-confirm-large { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; color: white; background: var(--success-color); border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
    .btn-modal-close { width: 100%; padding: 10px; font-size: 13px; font-weight: bold; color: var(--text-sub); background: #f0ebe0; border: none; border-radius: 6px; cursor: pointer; }
    .sub-change-title { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; font-weight: bold; }
    .shortcut-grid { display: flex; gap: 6px; margin-bottom: 10px; }
    .btn-short { flex: 1; padding: 8px 0; font-size: 13px; font-weight: bold; background: #ffffff; border: 1.5px solid var(--primary-color); color: var(--primary-color); border-radius: 6px; cursor: pointer; }
    
    /* トーストポップアップ：ヘッダー直下（最上部）へ配置変更 */
    .toast-popup {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(139, 115, 85, 0.95);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 2000;
      min-width: 260px;
      max-width: 90%;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .toast-warning {
      background: rgba(180, 40, 40, 0.95) !important;
      border-color: #ff8888 !important;
    }
    .loading-locked { pointer-events: none !important; opacity: 0.5; }
  </style>
</head>
<body>

<div class="app-header">
  <div class="admin-title">受付QR照合</div>
  <div class="header-actions">
    <label class="smooth-mode-label">
      <input type="checkbox" id="chkSmoothMode" checked onchange="toggleSmoothMode()"> スムーズ
    </label>
    <div class="btn-switch-camera" id="btnSwitchCamera" onclick="toggleCameraFacing()">🔄 インカメラ</div>
    <div class="status-badge" id="cameraStatus" onclick="restartCamera()" title="タップしてカメラを再起動">📷 起動中</div>
  </div>
</div>

<div class="scanner-card">
  <div id="reader"></div>
  <div class="scanner-overlay-guide"></div>
  <div class="scanner-hint">枠内にQRコードをかざしてください</div>
</div>

<div id="resultModal" class="modal-overlay">
  <div class="modal-sheet">
    <div id="modalBadge" class="modal-badge" style="color:var(--success-color);">【未受付】</div>
    <div id="modalName" class="modal-name">--- 様</div>
    <div id="modalDetail" class="modal-detail">一般 / 1名</div>

    <div id="modalActionArea">
      <button id="btnModalConfirm" class="btn-confirm-large" onclick="confirmCheckIn(currentData.count)">
        🟢 <span id="modalBtnText">1名</span> で受付確定
      </button>

      <div id="modalShortArea" style="display:none;">
        <div class="sub-change-title">人数を変更して受付:</div>
        <div id="modalShortcutGrid" class="shortcut-grid"></div>
      </div>
    </div>

    <button class="btn-modal-close" onclick="closeResultModal()">閉じる（次のスキャンへ）</button>
  </div>
</div>

<script>
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbyDQ3h_Vx72YPTgECxYYMUFUTtyQdgFsGtBlhSZrKReuKXFd3yDmcf2N15FnzgE8hgj4Q/exec";

  let inputCode = "";
  let currentData = null;
  let isLoading = false;
  let lastScannedCode = "";
  let scanCooldownTimer = null;
  let html5QrCode = null;
  let isCameraRunning = false;
  let currentFacingMode = "user";
  let isSmoothMode = true;
  let toastTimer = null;

  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(event) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  function toggleSmoothMode() {
    isSmoothMode = document.getElementById('chkSmoothMode').checked;
    if (isSmoothMode) {
      showAutoToast("⚡ 爆速スムーズモード ON", 1200);
    }
  }

  function playBeepSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      // 1音目（ド：C6 = 1046.5Hz）
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine'; // 芯のある澄んだ高音
      osc1.frequency.setValueAtTime(1046.5, audioCtx.currentTime);
      gain1.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start();
      osc1.stop(audioCtx.currentTime + 0.08);

      // 2音目（ソ：G6 = 1567.98Hz）
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1567.98, audioCtx.currentTime + 0.07);
      gain2.gain.setValueAtTime(0.25, audioCtx.currentTime + 0.07);
      gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(audioCtx.currentTime + 0.07);
      osc2.stop(audioCtx.currentTime + 0.18);
    } catch (e) {}
  }

  function callGasApi(params, callbackSuccess, callbackFailure) {
    const callbackName = 'gasCallback_' + Math.floor(Math.random() * 1000000);
    params.callback = callbackName;

    const queryString = Object.keys(params)
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
      .join('&');
    const script = document.createElement('script');
    script.src = API_ENDPOINT + '?' + queryString;

    window[callbackName] = function(data) {
      delete window[callbackName];
      document.body.removeChild(script);
      callbackSuccess(data);
    };

    script.onerror = function() {
      delete window[callbackName];
      document.body.removeChild(script);
      if (callbackFailure) callbackFailure(new Error('通信に失敗しました'));
    };

    document.body.appendChild(script);
  }

  function setLock(lockState) {
    isLoading = lockState;
    const modalAction = document.getElementById('modalActionArea');
    if (lockState) {
      if (modalAction) modalAction.classList.add('loading-locked');
    } else {
      if (modalAction) modalAction.classList.remove('loading-locked');
    }
  }

  function searchCode() {
    const targetCode = inputCode;
    
    if (!isSmoothMode) {
      setLock(true);
      showAutoToast("🔍 照会中...", 1000);
    } else {
      showAutoToast("⚡ 通信照会中...", 1000);
      setTimeout(function() {
        if (inputCode === targetCode) {
          inputCode = "";
        }
      }, 300);
    }

    callGasApi(
      { action: 'search', code: targetCode },
      function(res) {
        if (!isSmoothMode) setLock(false);

        if (res && res.success) {
          currentData = res;

          if (isSmoothMode) {
            if (res.status === "未受付") {
              confirmCheckInAuto(res);
            } else if (res.status === "受付済") {
              showAutoToast("⚠️ " + (res.nickname || "") + " 様<br>（すでに受付完了済みです）", 1500, true);
            } else if (res.status === "キャンセル") {
              showAutoToast("❌ " + (res.nickname || "") + " 様<br>（キャンセル扱い）", 1500, true);
            }
          } else {
            openResultModal(res);
          }

        } else {
          if (isSmoothMode) {
            showAutoToast("⚠️ 番号: " + targetCode + "<br>該当データがありません", 1500, true);
          } else {
            showAutoToast("❌ 番号: " + targetCode + "<br>該当データがありません", 1500, true);
          }
        }
      },
      function(err) {
        if (!isSmoothMode) setLock(false);
        showAutoToast("⚠️ 通信エラーが発生しました", 1500, true);
      }
    );
  }

  function confirmCheckInAuto(data) {
    callGasApi(
      { action: 'checkin', code: data.code, count: data.count },
      function(res) {
        if (res && res.success) {
          showAutoToast("✅ " + data.nickname + " 様<br>（" + data.count + "名）受付完了！", 1200);
        } else {
          showAutoToast("❌ 受付失敗: " + ((res && res.message) || ""), 1500, true);
        }
      },
      function(err) {
        showAutoToast("❌ 通信エラー", 1500, true);
      }
    );
  }

  function openResultModal(res) {
    const modal = document.getElementById('resultModal');
    const badge = document.getElementById('modalBadge');
    const actionArea = document.getElementById('modalActionArea');
    const shortArea = document.getElementById('modalShortArea');
    const grid = document.getElementById('modalShortcutGrid');

    document.getElementById('modalName').innerText = res.nickname + " 様";
    document.getElementById('modalDetail').innerText = res.category + " / 申込: " + res.count + "名";

    if (res.status === "キャンセル") {
      badge.innerText = "【キャンセル済み】";
      badge.style.color = "var(--danger-color)";
      actionArea.style.display = 'none';
    } else if (res.status === "受付済") {
      badge.innerText = "【受付完了済み（入場: " + res.actualCount + "名）】";
      badge.style.color = "var(--warning-color)";
      actionArea.style.display = 'none';
    } else {
      badge.innerText = "【未受付】";
      badge.style.color = "var(--success-color)";
      actionArea.style.display = 'block';
      document.getElementById('modalBtnText').innerText = res.count + "名";

      const maxCount = parseInt(res.count, 10);
      grid.innerHTML = "";
      if (maxCount > 1) {
        shortArea.style.display = 'block';
        for (let i = 1; i < maxCount; i++) {
          const btn = document.createElement('button');
          btn.className = 'btn-short';
          btn.innerText = i + '名';
          btn.onclick = function() { confirmCheckIn(i); };
          grid.appendChild(btn);
        }
      } else {
        shortArea.style.display = 'none';
      }
    }

    modal.style.display = 'flex';
  }

  function closeResultModal() {
    document.getElementById('resultModal').style.display = 'none';
    inputCode = "";
    lastScannedCode = "";
  }

  function confirmCheckIn(count) {
    if (isLoading || !currentData) return;
    setLock(true);

    callGasApi(
      { action: 'checkin', code: currentData.code, count: count },
      function(res) {
        setLock(false);
        if (res && res.success) {
          closeResultModal();
          showAutoToast("✅ " + currentData.nickname + " 様<br>（" + count + "名）受付完了！", 1500);
        } else {
          alert("エラー: " + ((res && res.message) || "受付処理に失敗しました"));
        }
      },
      function(err) {
        setLock(false);
        alert("通信エラーが発生しました: " + err.message);
      }
    );
  }

  function showAutoToast(msg, duration, isWarning) {
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }
    const oldToast = document.getElementById('autoToast');
    if (oldToast) oldToast.remove();

    const toast = document.createElement('div');
    toast.id = 'autoToast';
    toast.className = 'toast-popup' + (isWarning ? ' toast-warning' : '');
    toast.innerHTML = msg;
    document.body.appendChild(toast);

    toastTimer = setTimeout(function() {
      if (toast && toast.parentNode) {
        toast.style.opacity = "0";
        setTimeout(function() {
          if (toast && toast.parentNode) {
            toast.remove();
          }
        }, 300);
      }
    }, duration);
  }

  function updateCameraSwitchBtnText() {
    const btn = document.getElementById('btnSwitchCamera');
    if (currentFacingMode === "user") {
      btn.innerText = "🔄 アウトカメラ";
    } else {
      btn.innerText = "🔄 インカメラ";
    }
  }

  function toggleCameraFacing() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    updateCameraSwitchBtnText();
    restartCamera();
  }

  function initCameraScanner() {
    if (isCameraRunning) return;
    
    document.getElementById('cameraStatus').innerText = "📷 起動中...";
    document.getElementById('cameraStatus').style.background = "#e8e0d0";

    const scannerCard = document.querySelector('.scanner-card');
    const boxSize = scannerCard ? Math.floor(Math.min(scannerCard.clientWidth, scannerCard.clientHeight) * 0.7) : 220;

    html5QrCode = new Html5Qrcode("reader");
    const config = {
      fps: 30,
      qrbox: { width: boxSize, height: boxSize },
      aspectRatio: 1.0,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    html5QrCode.start(
      { facingMode: currentFacingMode },
      config,
      function onScanSuccess(decodedText) {
        if (!isSmoothMode) {
          const modal = document.getElementById('resultModal');
          if (modal && modal.style.display === 'flex') return;
        }

        const code = extractCode(decodedText);
        if (code && code !== lastScannedCode) {
          lastScannedCode = code;
          playBeepSound();
          inputCode = code;
          searchCode();

          clearTimeout(scanCooldownTimer);
          scanCooldownTimer = setTimeout(function() {
            lastScannedCode = "";
          }, 2000);
        }
      },
      function onScanFailure() {}
    ).then(function() {
      isCameraRunning = true;

      const videoElem = document.querySelector('#reader video');
      if (videoElem) {
        if (currentFacingMode === "user") {
          videoElem.style.setProperty('transform', 'scaleX(-1)', 'important');
        } else {
          videoElem.style.setProperty('transform', 'none', 'important');
        }
      }

      document.getElementById('cameraStatus').innerText = "🟢 稼働中";
      document.getElementById('cameraStatus').style.background = "#e6f4ea";
      document.getElementById('cameraStatus').style.color = "#137333";
    }).catch(function(err) {
      isCameraRunning = false;
      document.getElementById('cameraStatus').innerText = "⚠️ OFF (再試行)";
      document.getElementById('cameraStatus').style.background = "#fce8e6";
      document.getElementById('cameraStatus').style.color = "#c5221f";
    });
  }

  function restartCamera() {
    const statusBadge = document.getElementById('cameraStatus');
    statusBadge.innerText = "🔄 再起動中...";
    
    if (html5QrCode) {
      html5QrCode.stop().then(function() {
        isCameraRunning = false;
        html5QrCode.clear();
        setTimeout(initCameraScanner, 300);
      }).catch(function() {
        isCameraRunning = false;
        setTimeout(initCameraScanner, 300);
      });
    } else {
      initCameraScanner();
    }
  }

  function extractCode(text) {
    if (!text) return null;
    const trimmed = String(text).trim();
    if (/^\d{5}$/.test(trimmed)) {
      return trimmed;
    }
    const match = trimmed.match(/(\d{5})/);
    if (match) {
      return match[1];
    }
    return null;
  }

  window.addEventListener('DOMContentLoaded', function() {
    updateCameraSwitchBtnText();
    initCameraScanner();
  });
</script>

</body>
</html>
