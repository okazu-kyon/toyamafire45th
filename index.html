<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>受付用 QR照合システム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- QRスキャナーライブラリ (安定動作設定) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- 高視認性Webユニバーサルデザインフォント（Noto Sans JP）の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #8b7355;
      --primary-hover: #6d5a42;
      --accent-color: #b38636;
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-sub: #444444;
      --danger-color: #a00000;
      --success-color: #1e7e34;
      --warning-color: #d97706;
      --border-color: #d1c7b7;
    }

    * {
      box-sizing: border-box;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg-color);
      background-image: radial-gradient(#d1c7b7 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--text-main);
    }

    /* 上部エリア（カメラ＋ディスプレイ） */
    .top-section {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 8px 12px 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      overflow: hidden;
    }

    /* ヘッダー周りのスマート化 */
    .app-header {
      width: 100%;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 8px;
      flex-shrink: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .admin-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--primary-color);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .smooth-mode-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary-color);
      cursor: pointer;
      background: #f0eae1;
      padding: 4px 8px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      white-space: nowrap;
      user-select: none;
    }
    .smooth-mode-label input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    /* モード切替ボタン (画面右上) */
    .btn-mode-toggle {
      font-size: 12.5px;
      font-weight: 700;
      background: var(--primary-color);
      color: #ffffff;
      border: 1.5px solid var(--accent-color);
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn-mode-toggle:active {
      transform: scale(0.95);
    }
    .btn-mode-toggle.active-keypad {
      background: var(--accent-color);
      border-color: #ffffff;
    }

    .btn-switch-camera {
      font-size: 11px;
      background: #ffffff;
      color: var(--primary-color);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* カメラプレビュー窓（デフォルトは画面いっぱい広々表示） */
    .scanner-card {
      width: 100%;
      flex: 1;
      min-height: 260px;
      max-height: 440px;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 6px;
      position: relative;
      border: 2px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .scanner-overlay-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      border: 2px dashed rgba(255,255,255,0.85);
      border-radius: 14px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
    }

    .scanner-hint {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      pointer-events: none;
    }

    /* テンキーモード時のカメラコンパクト化 */
    body.mode-keypad .scanner-card {
      min-height: 100px;
      max-height: 130px;
    }

    /* ディスプレイ表示 */
    .display-box {
      width: 100%;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      padding: 4px 12px;
      background: var(--card-bg);
      border-radius: 8px;
      margin-bottom: 4px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border-color);
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.2s ease;
    }

    /* 通常スキャンモード時はディスプレイ・テンキーを非表示にしカメラを広々確保 */
    body:not(.mode-keypad) .display-box {
      display: none;
    }

    .status-msg {
      font-size: 13.5px;
      color: var(--text-sub);
      margin-bottom: 4px;
      height: 20px;
      font-weight: 700;
      text-align: center;
      line-height: 20px;
    }

    /* 下部固定テンキー (デフォルトは折りたたんで非表示) */
    .bottom-keypad-container {
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 8px 14px 18px 14px;
      box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.04);
      display: none;
    }

    body.mode-keypad .bottom-keypad-container {
      display: block;
      animation: keyFade 0.2s ease-out;
    }

    @keyframes keyFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 380px;
      margin: 0 auto;
    }

    .btn-key {
      font-size: 24px;
      font-weight: 700;
      padding: 9px 0;
      background: #fdfbf7;
      border: 1px solid var(--border-color);
      color: var(--primary-color);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-key:active { background: var(--accent-color); color: #ffffff; }
    .btn-clear { background: #fffafa; border-color: #f2e3e3; color: var(--danger-color); font-size: 20px; font-weight: 700; }
    .btn-bs { background: #fffdf5; border-color: var(--border-color); color: var(--warning-color); font-size: 20px; font-weight: 700; }

    /* 照合結果ポップアップシート */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(2px);
    }

    .modal-sheet {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 18px 18px 0 0;
      padding: 18px 20px 24px 20px;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.25);
      animation: slideUp 0.18s ease-out;
      border-top: 3px solid var(--accent-color);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-badge {
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .modal-name {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-color);
      text-align: center;
      margin: 2px 0 6px 0;
    }
    .modal-detail {
      font-size: 18px;
      color: var(--text-main);
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
    }

    .btn-confirm-large {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: 700;
      color: white;
      background: var(--success-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(30, 126, 52, 0.3);
      margin-bottom: 12px;
      transition: background 0.1s;
    }
    .btn-confirm-large:active { background: #165b26; }

    .btn-modal-close {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-sub);
      background: #f0ebe0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .sub-change-title { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; }
    .shortcut-grid { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-short {
      flex: 1;
      padding: 10px 0;
      font-size: 15px;
      font-weight: 700;
      background: #ffffff;
      border: 1.5px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-short:active { background: var(--primary-color); color: white; }

    /* トーストポップアップ */
    .toast-popup {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(139, 115, 85, 0.98);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid var(--accent-color);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      z-index: 2000;
      min-width: 260px;
      line-height: 1.4;
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translate(-50%, -20%); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .loading-locked {
      pointer-events: none !important;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>

<!-- 上部エリア（カメラ＋ディスプレイ） -->
<div class="top-section">
  <div class="app-header">
    <div class="admin-title">受付用 照合システム</div>
    <div class="header-actions">
      <label class="smooth-mode-label" title="スムーズモード: ON時は1名様で自動受付完了します">
        <input type="checkbox" id="chkSmoothMode" checked onchange="toggleSmoothMode()"> ⚡ スムーズ
      </label>
      <button type="button" class="btn-switch-camera" id="btnSwitchCamera" onclick="toggleCameraFacing()">🔄 カメラ切替</button>
      <button type="button" id="btnToggleMode" class="btn-mode-toggle" onclick="toggleKeypadMode()">
        <span>⌨️ 5桁番号で受付</span>
      </button>
    </div>
  </div>

  <!-- 常時カメラ読み取り窓（スキャンモード時は画面いっぱいに広々表示） -->
  <div class="scanner-card">
    <div id="reader"></div>
    <div class="scanner-overlay-guide"></div>
    <div class="scanner-hint">枠内にQRコードをかざしてください</div>
  </div>

  <div id="display" class="display-box">-----</div>
  <div id="statusMsg" class="status-msg">枠内にQRコードをかざしてください</div>
</div>

<!-- 下部固定テンキー -->
<div class="bottom-keypad-container">
  <div class="keypad">
    <button class="btn-key" onclick="pressKey('1')">1</button>
    <button class="btn-key" onclick="pressKey('2')">2</button>
    <button class="btn-key" onclick="pressKey('3')">3</button>
    <button class="btn-key" onclick="pressKey('4')">4</button>
    <button class="btn-key" onclick="pressKey('5')">5</button>
    <button class="btn-key" onclick="pressKey('6')">6</button>
    <button class="btn-key" onclick="pressKey('7')">7</button>
    <button class="btn-key" onclick="pressKey('8')">8</button>
    <button class="btn-key" onclick="pressKey('9')">9</button>
    <button class="btn-key btn-clear" onclick="clearKey()">C</button>
    <button class="btn-key" onclick="pressKey('0')">0</button>
    <button class="btn-key btn-bs" onclick="backspaceKey()">⌫</button>
  </div>
</div>

<!-- 照合結果ポップアップシート -->
<div id="resultModal" class="modal-overlay">
  <div class="modal-sheet">
    <div id="modalBadge" class="modal-badge" style="color:var(--success-color);">【未受付】</div>
    <div id="modalName" class="modal-name">--- 様</div>
    <div id="modalDetail" class="modal-detail">一般 / 1名</div>

    <div id="modalActionArea">
      <button id="btnModalConfirm" class="btn-confirm-large" onclick="confirmCheckIn(currentData.count)">
        🟢 <span id="modalBtnText">1名</span> で受付確定
      </button>

      <div id="modalShortArea" style="display:none;">
        <div class="sub-change-title">人数を変更して受付:</div>
        <div id="modalShortcutGrid" class="shortcut-grid"></div>
      </div>
    </div>

    <button class="btn-modal-close" onclick="closeResultModal()">閉じる（次のスキャンへ）</button>
  </div>
</div>

<script>
  const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbyDQ3h_Vx72YPTgECxYYMUFUTtyQdgFsGtBlhSZrKReuKXFd3yDmcf2N15FnzgE8hgj4Q/exec";

  let inputCode = "";
  let currentData = null;
  let isLoading = false;
  let lastScannedCode = "";
  let scanCooldownTimer = null;
  let isKeypadMode = false;
  let currentFacingMode = "environment";
  let html5QrCode = null;

  let isSmoothMode = true;

  function toggleSmoothMode() {
    const chk = document.getElementById('chkSmoothMode');
    if (chk) {
      isSmoothMode = chk.checked;
      if (isSmoothMode) {
        showAutoToast("⚡ スムーズモード ON<br><span style='font-size:12px;'>1名様は自動受付完了します</span>", 1500);
      } else {
        showAutoToast("💬 スムーズモード OFF<br><span style='font-size:12px;'>毎回確認ダイアログを表示します</span>", 1500);
      }
    }
  }

  function toggleKeypadMode(forceMode) {
    if (typeof forceMode === 'boolean') {
      isKeypadMode = forceMode;
    } else {
      isKeypadMode = !isKeypadMode;
    }

    const body = document.body;
    const toggleBtn = document.getElementById('btnToggleMode');
    const statusMsg = document.getElementById('statusMsg');

    if (isKeypadMode) {
      body.classList.add('mode-keypad');
      if (toggleBtn) {
        toggleBtn.classList.add('active-keypad');
        toggleBtn.innerHTML = '<span>📷 QRスキャンに戻る</span>';
      }
      if (statusMsg) statusMsg.innerText = '5桁の受付番号を入力してください';
    } else {
      body.classList.remove('mode-keypad');
      if (toggleBtn) {
        toggleBtn.classList.remove('active-keypad');
        toggleBtn.innerHTML = '<span>⌨️ 5桁番号で受付</span>';
      }
      if (statusMsg) statusMsg.innerText = '枠内にQRコードをかざしてください';
      clearKey();
    }
  }

  // JSONPでGAS APIを呼び出す関数（CORS制約を完全回避）
  function callGasApi(params, callbackSuccess, callbackFailure) {
    const callbackName = 'gasCallback_' + Math.floor(Math.random() * 1000000);
    params.callback = callbackName;

    const queryString = Object.keys(params)
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
      .join('&');
    const script = document.createElement('script');
    script.src = API_ENDPOINT + '?' + queryString;

    window[callbackName] = function(data) {
      delete window[callbackName];
      document.body.removeChild(script);
      callbackSuccess(data);
    };

    script.onerror = function() {
      delete window[callbackName];
      document.body.removeChild(script);
      if (callbackFailure) callbackFailure(new Error('通信に失敗しました'));
    };

    document.body.appendChild(script);
  }

  function setLock(lockState) {
    isLoading = lockState;
    const keypadContainer = document.querySelector('.bottom-keypad-container');
    const modalAction = document.getElementById('modalActionArea');
    if (lockState) {
      if (keypadContainer) keypadContainer.classList.add('loading-locked');
      if (modalAction) modalAction.classList.add('loading-locked');
    } else {
      if (keypadContainer) keypadContainer.classList.remove('loading-locked');
      if (modalAction) modalAction.classList.remove('loading-locked');
    }
  }

  function updateDisplay() {
    const disp = document.getElementById('display');
    if (disp) disp.innerText = inputCode ? inputCode.padEnd(5, '-') : "-----";
    
    if (inputCode.length === 5) {
      searchCode();
    }
  }

  function pressKey(num) {
    if (isLoading) return;
    if (!isKeypadMode) {
      toggleKeypadMode(true);
    }
    if (inputCode.length < 5) {
      inputCode += num;
      updateDisplay();
    }
  }

  function clearKey() {
    inputCode = "";
    updateDisplay();
    document.getElementById('statusMsg').innerText = isKeypadMode ? '5桁の受付番号を入力してください' : '枠内にQRコードをかざしてください';
  }

  function backspaceKey() {
    if (isLoading) return;
    if (inputCode.length > 0) {
      inputCode = inputCode.slice(0, -1);
      updateDisplay();
    }
  }

  function searchCode() {
    if (isLoading || !inputCode) return;
    setLock(true);
    document.getElementById('statusMsg').innerText = "照合中 (" + inputCode + ")...";

    callGasApi(
      { action: 'search', code: inputCode },
      function(res) {
        setLock(false);
        if (res && res.success) {
          playBeepSound();
          currentData = res;

          // スムーズモード判定: 未受付かつ1名様の場合は自動受付完了
          if (isSmoothMode && res.status !== "キャンセル" && res.status !== "受付済" && parseInt(res.count, 10) === 1) {
            confirmCheckIn(1);
          } else {
            showResultModal(res);
          }
        } else {
          document.getElementById('statusMsg').innerText = "❌ 該当なし: " + inputCode;
          showAutoToast("❌ 該当なし: " + inputCode, 2000);
          setTimeout(clearKey, 1500);
        }
      },
      function(err) {
        setLock(false);
        document.getElementById('statusMsg').innerText = "通信エラー発生";
        showAutoToast("⚠️ 通信エラーが発生しました", 2000);
      }
    );
  }

  function showResultModal(res) {
    const modal = document.getElementById('resultModal');
    const badge = document.getElementById('modalBadge');
    const name = document.getElementById('modalName');
    const detail = document.getElementById('modalDetail');
    const actionArea = document.getElementById('modalActionArea');
    const shortArea = document.getElementById('modalShortArea');
    const grid = document.getElementById('modalShortcutGrid');

    name.innerText = (res.nickname || "ご来場者") + " 様";
    detail.innerText = (res.category || "一般") + " / " + (res.count || 1) + "名";

    if (res.status === "キャンセル") {
      badge.innerText = "【キャンセル済み】";
      badge.style.color = "var(--danger-color)";
      actionArea.style.display = 'none';
    } else if (res.status === "受付済") {
      badge.innerText = "【受付完了済み（入場: " + res.actualCount + "名）】";
      badge.style.color = "var(--warning-color)";
      actionArea.style.display = 'none';
    } else {
      badge.innerText = "【未受付】";
      badge.style.color = "var(--success-color)";
      actionArea.style.display = 'block';
      document.getElementById('modalBtnText').innerText = res.count + "名";

      const maxCount = parseInt(res.count, 10);
      grid.innerHTML = "";
      if (maxCount > 1) {
        shortArea.style.display = 'block';
        for (let i = 1; i < maxCount; i++) {
          const btn = document.createElement('button');
          btn.className = 'btn-short';
          btn.innerText = i + '名';
          btn.onclick = function() { confirmCheckIn(i); };
          grid.appendChild(btn);
        }
      } else {
        shortArea.style.display = 'none';
      }
    }

    modal.style.display = 'flex';
  }

  function closeResultModal() {
    document.getElementById('resultModal').style.display = 'none';
    inputCode = "";
    lastScannedCode = "";
    updateDisplay();
  }

  function confirmCheckIn(count) {
    if (isLoading || !currentData) return;
    setLock(true);

    callGasApi(
      { action: 'checkin', code: currentData.code, count: count },
      function(res) {
        setLock(false);
        if (res && res.success) {
          closeResultModal();
          showAutoToast("✅ " + currentData.nickname + " 様<br>（" + count + "名）受付完了！", 2000);
          clearKey();
          // 受付完了後は自動でスキャンモードへ広々復帰
          toggleKeypadMode(false);
        } else {
          alert("エラー: " + ((res && res.message) || "受付処理に失敗しました"));
        }
      },
      function(err) {
        setLock(false);
        alert("通信エラーが発生しました: " + err.message);
      }
    );
  }

  function showAutoToast(msg, duration) {
    const oldToast = document.getElementById('autoToast');
    if (oldToast) oldToast.remove();

    const toast = document.createElement('div');
    toast.id = 'autoToast';
    toast.className = 'toast-popup';
    toast.innerHTML = msg;
    document.body.appendChild(toast);

    setTimeout(function() {
      if (toast) {
        toast.style.transition = "opacity 0.3s ease";
        toast.style.opacity = "0";
        setTimeout(function() { toast.remove(); }, 300);
      }
    }, duration);
  }

  function playBeepSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1046.5, audioCtx.currentTime);
      gain1.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start();
      osc1.stop(audioCtx.currentTime + 0.08);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1567.98, audioCtx.currentTime + 0.07);
      gain2.gain.setValueAtTime(0.25, audioCtx.currentTime + 0.07);
      gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(audioCtx.currentTime + 0.07);
      osc2.stop(audioCtx.currentTime + 0.18);
    } catch (e) {}
  }

  // ============================
  // 常時QRコードスキャナー初期化
  // ============================
  function initCameraScanner() {
    html5QrCode = new Html5Qrcode("reader");
    const config = {
      fps: 15,
      qrbox: { width: 160, height: 160 },
      aspectRatio: 1.33
    };

    html5QrCode.start(
      { facingMode: currentFacingMode },
      config,
      function onScanSuccess(decodedText) {
        const code = extractCode(decodedText);
        if (code && code !== lastScannedCode && !isLoading) {
          lastScannedCode = code;
          inputCode = code;
          updateDisplay();
          
          if (scanCooldownTimer) clearTimeout(scanCooldownTimer);
          scanCooldownTimer = setTimeout(function() {
            lastScannedCode = "";
          }, 3000);
        }
      },
      function onScanError(errorMessage) {}
    ).catch(function(err) {
      console.error("Camera start error", err);
    });
  }

  function toggleCameraFacing() {
    if (!html5QrCode) return;
    currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
    html5QrCode.stop().then(function() {
      initCameraScanner();
    }).catch(function() {
      initCameraScanner();
    });
  }

  function extractCode(text) {
    if (!text) return "";
    const match = text.match(/\b\d{5}\b/);
    if (match) return match[0];
    const cleaned = text.trim();
    if (/^\d{5}$/.test(cleaned)) return cleaned;
    return text.substring(0, 5);
  }

  window.addEventListener("DOMContentLoaded", initCameraScanner);
</script>
